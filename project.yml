name: Nightshift
options:
  bundleIdPrefix: com.nightshift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.7
targets:
  Nightshift:
    type: application
    platform: iOS
    sources:
      - path: Nightshift
        excludes:
          - Info.plist
          - Nightshift.entitlements
          - SupabaseConfig.example.plist
    dependencies:
      - package: Supabase
        product: Supabase
    preBuildScripts:
      - name: Ensure Supabase config
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/Nightshift/SupabaseConfig.plist" ]; then
            cp "$SRCROOT/Nightshift/SupabaseConfig.example.plist" "$SRCROOT/Nightshift/SupabaseConfig.plist"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightshift.app
        PRODUCT_NAME: Nightshift
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nightshift/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nightshift/Nightshift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - NightshiftTests
        - NightshiftUITests
      gatherCoverageData: false
  NightshiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NightshiftTests
    dependencies:
      - target: Nightshift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nightshift.app.tests
  NightshiftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NightshiftUITests
    dependencies:
      - target: Nightshift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nightshift.app.uitests
        TEST_TARGET_NAME: Nightshift
